name: Zenith CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # Stage 1: Java Spring Boot Tests & Build
  # ==========================================
  test-backend:
    name: Backend Unit Tests & Code Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests
        working-directory: ./backend
        run: mvn clean test

  # ==========================================
  # Stage 2: React Frontend Build & Lint
  # ==========================================
  test-frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package.json

      - name: Install Dependencies & Build Bundle
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  # ==========================================
  # Stage 3: Security & Vulnerability Scan (DevSecOps)
  # ==========================================
  security-scan:
    name: Trivy Vulnerability & Security Audit
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  # ==========================================
  # Stage 4: Docker Container Packaging
  # ==========================================
  docker-build:
    name: Build & Verify Cloud Containers
    needs: [security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: zenith-backend:${{ github.sha }}, zenith-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: zenith-frontend:${{ github.sha }}, zenith-frontend:latest

  # ==========================================
  # Stage 5: Automated Continuous Deployment to AWS EC2
  # ==========================================
  deploy-to-cloud:
    name: Automated Cloud Deployment (EC2)
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - name: Deploy to Cloud Server via SSH
        if: env.EC2_HOST != '' && env.EC2_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: 'ubuntu'
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "--> Connected to EC2 Server. Pulling latest Git changes..."
            cd /home/ubuntu/zenith-platform || cd ~/zenith-platform
            git pull origin main
            echo "--> Rebuilding containers with zero downtime..."
            docker compose up --build -d
            echo "--> Cloud Deployment complete and verified!"
