spring.application.name=zenith-backend
server.port=8080

# PostgreSQL Production Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/zenithdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:zenithuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:zenithpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator Health & Metrics endpoints for Cloud Container Probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
