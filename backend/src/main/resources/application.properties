spring.application.name=zenith-backend
server.port=8080

# Database Configuration (H2 in-memory by default with persistence file option)
spring.datasource.url=jdbc:h2:mem:zenithdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator Health & Metrics endpoints for Cloud Container Probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

