version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: zenith-jenkins
    user: root
    privileged: true
    ports:
      - "8082:8080"      # Jenkins Web UI accessible at http://localhost:8082
      - "50000:50000"    # Jenkins Inbound Agent port
    volumes:
      - jenkins_data:/var/jenkins_home
      # Mount host docker socket so Jenkins can build & push Docker containers
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m -Djenkins.install.runSetupWizard=true
    restart: unless-stopped

volumes:
  jenkins_data:
    name: zenith_jenkins_data
