version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zenith-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zenithdb}
      POSTGRES_USER: ${POSTGRES_USER:-zenithuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zenithpass}
    ports:
      - "5432:5432"
    volumes:
      - zenith_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zenithuser} -d ${POSTGRES_DB:-zenithdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-zenithadmin/zenith-backend:latest}
    container_name: zenith-backend-prod
    ports:
      - "8085:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-zenithdb}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-zenithuser}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-zenithpass}
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
    volumes:
      - /opt/zenith/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  frontend:
    image: ${FRONTEND_IMAGE:-zenithadmin/zenith-frontend:latest}
    container_name: zenith-frontend-prod
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

volumes:
  zenith_prod_pgdata:
    name: zenith_prod_pgdata

networks:
  default:
    name: zenith-prod-network
